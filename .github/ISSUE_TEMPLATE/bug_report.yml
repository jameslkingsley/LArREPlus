name: Bug report
description: Report reproducible Larre Plus behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Larre Plus. Please remove unrelated mods where practical before reporting a compatibility issue.

  - type: input
    id: stationeers-build
    attributes:
      label: Stationeers build
      description: Copy the full build/version shown by the game or server log.
    validations:
      required: true

  - type: input
    id: mod-versions
    attributes:
      label: Mod environment
      description: Include Larre Plus, BepInEx, and StationeersLaunchPad versions.
      placeholder: Larre Plus 0.2.2, BepInEx 5.4.23.3, LaunchPad 0.5.0
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Game environment
      options:
        - Single-player
        - Listen server
        - Dedicated server and client
        - Dedicated server only
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Place and power...
        2. Configure...
        3. Activate...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the smallest useful Player.log excerpt.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Installation checks
      options:
        - label: The server and every connected client use the same Larre Plus DLL.
          required: true
        - label: Only one LarrePlus.dll exists under the enabled mod directory.
          required: true
